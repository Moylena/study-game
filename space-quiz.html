<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Space Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0D0F1A;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .game-wrap {
      position: relative;
      display: inline-block;
      line-height: 0;
    }
    canvas { border: 2px solid #1E2448; display: block; }
    #initials-wrap {
      position: absolute;
      top: 308px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      font: 16px 'Share Tech Mono', monospace;
      color: #9AB0C8;
      white-space: nowrap;
    }
    #initials-wrap.hidden { display: none; }
    #initials-input {
      width: 58px;
      padding: 5px 8px;
      background: #111428;
      border: 1px solid #1E2448;
      border-radius: 4px;
      color: #E0E4F0;
      font: 17px 'Share Tech Mono', monospace;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
    #initials-input:focus { outline: none; border-color: #5A7FFF; }
  </style>
</head>
<body>
  <div class="game-wrap">
    <canvas id="canvas" width="800" height="600"></canvas>
    <div id="initials-wrap">
      <label for="initials-input">Your initials (optional):</label>
      <input id="initials-input" type="text" maxlength="3" placeholder="—" autocomplete="off">
    </div>
  </div>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');

    // ── Constants ──────────────────────────────────────────────────
    const W  = 800;
    const H  = 600;
    const ASTEROID_RADIUS = 75;
    const ASTEROID_SPEED  = 42;
    const BULLET_SPEED    = 480;
    const GUN_SPEED       = 300;
    const GUN_W  = 40;
    const GUN_H  = 62;
    const BUL_W  = 4;
    const BUL_H  = 14;
    const END_MS = 5000;

    // ── Style guide colours ────────────────────────────────────────
    const C = {
      bg:     '#0D0F1A',
      navy:   '#111428',
      panel:  '#1E2448',
      white:  '#E0E4F0',
      grey:   '#9AB0C8',
      green:  '#5AFF8A',
      blue:   '#5A7FFF',
      red:    '#FF5A5A',
      amber:  '#FFB83A',
      violet: '#C87AFF',
    };

    const F = {
      header: "'VT323', monospace",
      mono:   "'Share Tech Mono', monospace",
    };

    // ── Asteroid colours ───────────────────────────────────────────
    const ASTEROID_COLORS = [
      { fill: '#0A1230', stroke: C.blue   },
      { fill: '#160B2E', stroke: C.violet },
      { fill: '#1A1100', stroke: C.amber  },
      { fill: '#1E0808', stroke: C.red    },
    ];

    // ── Pixel ship ─────────────────────────────────────────────────
    const SHIP_P = 6;
    const SHIP_ROWS = [
      [0,  0,  0,  0, 'G','G',  0,  0,  0,  0],
      [0,  0,  0, 'W','W','W','W',  0,  0,  0],
      [0,  0, 'W','W','W','W','W','W',  0,  0],
      [0, 'W','W','B','W','W','B','W','W',  0],
      ['w','W','W','W','W','W','W','W','W','w'],
      ['w','w','W','W','W','W','W','W','w','w'],
      [0, 'w','w',  0,'w','w',  0,'w','w',  0],
      [0, 'A','A',  0,'R','R',  0,'A','A',  0],
      [0,  0, 'A',  0,'R','R',  0,'A',  0,  0],
      [0,  0,  0,  0,'R',  0,  0,  0,  0,  0],
    ];
    const SHIP_COLORS = {
      G: C.green,
      W: C.white,
      w: C.grey,
      B: C.blue,
      A: C.amber,
      R: C.red,
    };

    function drawShip(cx) {
      const tx = Math.round(cx) - (SHIP_P * 5);
      const ty = H - GUN_H + 4;
      for (let r = 0; r < SHIP_ROWS.length; r++) {
        for (let c = 0; c < SHIP_ROWS[r].length; c++) {
          const code = SHIP_ROWS[r][c];
          if (!code) continue;
          ctx.fillStyle = SHIP_COLORS[code];
          ctx.fillRect(tx + c * SHIP_P, ty + r * SHIP_P, SHIP_P, SHIP_P);
        }
      }
    }

    // ── Starfield ──────────────────────────────────────────────────
    const STARS = Array.from({ length: 130 }, () => ({
      x:       Math.random() * W,
      y:       Math.random() * H,
      opacity: 0.12 + Math.random() * 0.32,
      size:    Math.random() < 0.07 ? 2 : 1,
    }));

    function drawStars() {
      const scrollY = state === 'START' ? (performance.now() * 0.02) % H : 0;
      for (const s of STARS) {
        const sy = (s.y + scrollY) % H;
        ctx.fillStyle = `rgba(224,228,240,${s.opacity})`;
        ctx.fillRect(Math.floor(s.x), Math.floor(sy), s.size, s.size);
      }
    }

    // ── Questions ──────────────────────────────────────────────────
    let QUESTIONS = [];
    let errorMsg  = '';

    function validateQuestions(data) {
      if (!Array.isArray(data) || data.length === 0) return 'File must contain a non-empty array.';
      for (let i = 0; i < data.length; i++) {
        const q = data[i];
        if (!q.question)                                       return `Question ${i + 1}: missing "question" field.`;
        if (q.correct === undefined || q.correct === null)     return `Question ${i + 1}: missing "correct" field.`;
        if (!Array.isArray(q.wrong) || q.wrong.length !== 3)  return `Question ${i + 1}: "wrong" must be an array of exactly 3 answers.`;
      }
      return null;
    }

    const EMBEDDED_QUESTIONS = [{"question":"What is a Java array?","correct":"Linear data structure","wrong":["Circular structure","Dynamic list","Hash table"]},{"question":"What index does a Java array start at?","correct":"0","wrong":["1","-1","n"]},{"question":"What is the last index of an array of length n?","correct":"n-1","wrong":["n","n+1","n-2"]},{"question":"What type of structure is a Java array?","correct":"Object","wrong":["Primitive","Interface","Abstract class"]},{"question":"Can an array hold different data types?","correct":"No, must match","wrong":["Yes, any type","Only primitives","Only objects"]},{"question":"Is the length of a Java array mutable?","correct":"No, immutable","wrong":["Yes, mutable","Only at runtime","Depends on type"]},{"question":"Are array elements mutable in Java?","correct":"Yes, mutable","wrong":["No, immutable","Only primitives","Only strings"]},{"question":"Can the data type of an array be changed?","correct":"No, immutable","wrong":["Yes, anytime","Only with cast","At compile time"]},{"question":"Java arrays possess additional methods because they are...","correct":"Objects","wrong":["Primitives","Interfaces","Enums"]}];

    function boot() {
      state = 'LOADING';
      render();
      try {
        const data = EMBEDDED_QUESTIONS;
        const err = validateQuestions(data);
        if (err) throw new Error(err);
        QUESTIONS = data.map(q => ({
          question: String(q.question),
          correct:  String(q.correct),
          wrong:    q.wrong.map(String),
        }));
        state = 'START';
      } catch (e) {
        errorMsg = e.message;
        state    = 'ERROR';
      }
      syncInputVisibility();
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(loop);
    }

    // ── Pure functions ─────────────────────────────────────────────

    function shuffleArray(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildAsteroids(qObj) {
      const answers = shuffleArray([qObj.correct, ...qObj.wrong]);
      const zones   = shuffleArray([0, 1, 2, 3]);
      return answers.map((answer, i) => {
        const z   = zones[i];
        const pad = ASTEROID_RADIUS + 10;
        const minX = z * (W / 4) + pad;
        const maxX = (z + 1) * (W / 4) - pad;
        return {
          x:         minX + Math.random() * (maxX - minX),
          y:         66 + ASTEROID_RADIUS,
          answer,
          isCorrect: answer === qObj.correct,
          radius:    ASTEROID_RADIUS,
          colorIdx:  i,
        };
      });
    }

    function drawAsteroidText(ctx, text, cx, cy, radius) {
      const fontSize   = 16;
      const lineHeight = 21;
      const maxWidth   = radius * 1.5;
      ctx.font      = `bold ${fontSize}px ${F.mono}`;
      ctx.textAlign = 'center';
      const words = text.split(' ');
      const lines  = [];
      let line = '';
      for (const word of words) {
        const test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = word; }
        else line = test;
      }
      if (line) lines.push(line);
      const totalHeight = lines.length * lineHeight;
      const startY = cy - totalHeight / 2 + fontSize;
      const needsBg = lines.length > 1;
      for (let i = 0; i < lines.length; i++) {
        const y = startY + i * lineHeight;
        if (needsBg) {
          const w = ctx.measureText(lines[i]).width;
          ctx.fillStyle = 'rgba(13,15,26,0.85)';
          ctx.fillRect(cx - w / 2 - 3, y - fontSize, w + 6, fontSize + 4);
        }
        ctx.fillStyle = C.white;
        ctx.fillText(lines[i], cx, y);
      }
    }

    function bulletHitsAsteroid(b, a) {
      const cx = b.x + BUL_W / 2, cy = b.y + BUL_H / 2;
      const dx = cx - a.x, dy = cy - a.y;
      return (dx * dx + dy * dy) < (a.radius * a.radius);
    }

    function asteroidReachedBottom(a) { return a.y + a.radius >= H; }

    // ── Mutable state ──────────────────────────────────────────────
    let state           = 'LOADING';
    let score           = 0;
    let qIndex          = 0;
    let qId             = 0;
    let asteroids       = [];
    let bullets         = [];
    let gunX            = W / 2;
    let keys            = {};
    let endTitle        = '';
    let endTimer        = null;
    let endStartTs      = 0;
    let wrongQuestion   = null;
    let wrongChosen     = '';
    let wrongTimer      = null;
    let wrongStartTs    = 0;
    let playerInitials  = '';
    let rafId           = null;
    let lastTs          = null;
    let startBtn        = null;

    const WRONG_MS = 3000;

    // ── Analytics ─────────────────────────────────────────────────

    function saveScore(initials, score, total) {
      const scores = JSON.parse(localStorage.getItem('sq_scores') || '[]');
      scores.unshift({ initials, score, total, ts: new Date().toISOString() });
      localStorage.setItem('sq_scores', JSON.stringify(scores));
    }
    function getRecentScores(initials) {
      const all = JSON.parse(localStorage.getItem('sq_scores') || '[]');
      return all.filter(s => s.initials === initials).slice(0, 5);
    }
    function fmtDate(isoStr) {
      const d = new Date(isoStr);
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
           + ' ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    }
    function syncInputVisibility() {
      const wrap = document.getElementById('initials-wrap');
      if (state === 'START' && !devAnalytics) wrap.classList.remove('hidden');
      else wrap.classList.add('hidden');
    }

    // ── Game flow ──────────────────────────────────────────────────

    function startGame() {
      if (endTimer)   { clearTimeout(endTimer);   endTimer   = null; }
      if (wrongTimer) { clearTimeout(wrongTimer); wrongTimer = null; }
      const raw = document.getElementById('initials-input').value.trim().toUpperCase();
      playerInitials = raw || 'ANON';
      score = 0; qIndex = 0; bullets = []; gunX = W / 2; keys = {}; lastTs = null;
      state = 'PLAYING';
      syncInputVisibility();
      loadQuestion();
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(loop);
    }

    function loadQuestion() { qId++; asteroids = buildAsteroids(QUESTIONS[qIndex]); bullets = []; }

    function triggerEnd(title) {
      state = 'END'; endTitle = title; endStartTs = performance.now();
      saveScore(playerInitials, score, QUESTIONS.length);
      if (endTimer) clearTimeout(endTimer);
      endTimer = setTimeout(() => { state = 'START'; syncInputVisibility(); }, END_MS);
    }

    function triggerWrong(chosenAnswer) {
      state = 'WRONG_ANSWER'; wrongQuestion = QUESTIONS[qIndex];
      wrongChosen = chosenAnswer; wrongStartTs = performance.now();
      asteroids = []; bullets = [];
      if (wrongTimer) clearTimeout(wrongTimer);
      wrongTimer = setTimeout(() => triggerEnd('Wrong answer! Game over.'), WRONG_MS);
    }

    function fireBullet() { bullets.push({ x: gunX - BUL_W / 2, y: H - GUN_H - BUL_H, qId }); }

    // ── Update ─────────────────────────────────────────────────────

    function update(dt) {
      if (keys.ArrowLeft)  gunX = Math.max(GUN_W / 2,     gunX - GUN_SPEED * dt);
      if (keys.ArrowRight) gunX = Math.min(W - GUN_W / 2, gunX + GUN_SPEED * dt);
      for (const b of bullets) b.y -= BULLET_SPEED * dt;
      bullets = bullets.filter(b => b.y + BUL_H > 0);
      for (const a of asteroids) a.y += ASTEROID_SPEED * dt;

      let hitBulletIdx = -1, hitAsteroid = null;
      outer:
      for (let i = 0; i < bullets.length; i++) {
        if (bullets[i].qId !== qId) continue;
        for (const a of asteroids) {
          if (bulletHitsAsteroid(bullets[i], a)) { hitBulletIdx = i; hitAsteroid = a; break outer; }
        }
      }

      if (hitAsteroid !== null) {
        bullets.splice(hitBulletIdx, 1);
        if (hitAsteroid.isCorrect) {
          score++; qIndex++;
          if (qIndex >= QUESTIONS.length) triggerEnd('You finished!');
          else loadQuestion();
        } else { triggerWrong(hitAsteroid.answer); }
        return;
      }
      for (const a of asteroids) {
        if (asteroidReachedBottom(a)) { triggerEnd("Time's up! Game over."); return; }
      }
    }

    // ── Render ─────────────────────────────────────────────────────

    function render() {
      ctx.fillStyle = C.bg;
      ctx.fillRect(0, 0, W, H);
      drawStars();
      if      (state === 'LOADING')      renderLoading();
      else if (state === 'ERROR')        renderError();
      else if (state === 'START')        renderStart();
      else if (state === 'PLAYING')      renderGame();
      else if (state === 'WRONG_ANSWER') renderWrongAnswer();
      else if (state === 'END')          renderEnd();
      if (devAnalytics) renderAnalytics();
    }

    function renderLoading() {
      ctx.textAlign = 'center';
      ctx.fillStyle = C.grey;
      ctx.font      = `22px ${F.mono}`;
      ctx.fillText('Loading questions\u2026', W / 2, H / 2);
    }

    function wrapText(text, maxWidth) {
      const words = text.split(' ');
      const lines = []; let line = '';
      for (const word of words) {
        const test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = word; }
        else line = test;
      }
      if (line) lines.push(line);
      return lines;
    }

    function renderError() {
      ctx.textAlign = 'center';
      ctx.fillStyle = C.white;
      ctx.font      = `bold 28px ${F.mono}`;
      ctx.fillText('Failed to load questions', W / 2, 190);
      ctx.font      = `16px ${F.mono}`;
      ctx.fillStyle = C.red;
      const lines   = wrapText(errorMsg, W - 80);
      lines.forEach((line, i) => ctx.fillText(line, W / 2, 235 + i * 22));
      const afterMsg = 235 + lines.length * 22 + 20;
      ctx.fillStyle = C.grey;
      ctx.font      = `15px ${F.mono}`;
      ctx.fillText('Serve the folder with a local server, e.g.:', W / 2, afterMsg);
      ctx.fillText('python3 -m http.server 8000', W / 2, afterMsg + 22);
      ctx.fillText('then open http://localhost:8000/space-quiz.html', W / 2, afterMsg + 44);
    }

    function renderStart() {
      ctx.textAlign = 'center';

      ctx.fillStyle = C.white;
      ctx.font      = `bold 66px ${F.header}`;
      ctx.fillText('SPACE QUIZ', W / 2, 148);

      ctx.font      = `19px ${F.mono}`;
      ctx.fillStyle = C.grey;
      ctx.fillText('Shoot the asteroid with the correct answer', W / 2, 210);
      ctx.fillText('Arrow keys to move   \u00b7   Space to fire', W / 2, 238);

      ctx.strokeStyle = C.panel;
      ctx.lineWidth   = 1;
      ctx.beginPath();
      ctx.moveTo(W / 2 - 180, 266); ctx.lineTo(W / 2 + 180, 266);
      ctx.stroke();

      const bx = W / 2 - 90, by = 370, bw = 180, bh = 56;
      ctx.strokeStyle = C.blue;
      ctx.lineWidth   = 2;
      ctx.strokeRect(bx, by, bw, bh);
      ctx.font      = `bold 38px ${F.header}`;
      ctx.fillStyle = C.white;
      ctx.fillText('START', W / 2, by + 40);
      startBtn = { x: bx, y: by, w: bw, h: bh };

      ctx.font      = `12px ${F.mono}`;
      ctx.fillStyle = '#252840';
      ctx.textAlign = 'left';  ctx.fillText('A', 14, H - 12);
      ctx.textAlign = 'right'; ctx.fillText('P', W - 14, H - 12);
      ctx.textAlign = 'center';
    }

    function renderGame() {
      const q = QUESTIONS[qIndex];

      ctx.fillStyle = C.green;
      ctx.font      = `18px ${F.mono}`;
      ctx.textAlign = 'left';
      ctx.fillText(`Score: ${score}`, 12, 22);

      ctx.fillStyle = C.white;
      ctx.font      = `bold 24px ${F.mono}`;
      ctx.textAlign = 'center';
      ctx.fillText(q.question, W / 2, 52);

      ctx.strokeStyle = C.panel;
      ctx.lineWidth   = 1;
      ctx.beginPath(); ctx.moveTo(0, 66); ctx.lineTo(W, 66); ctx.stroke();

      for (const a of asteroids) {
        const ac = ASTEROID_COLORS[a.colorIdx];
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.radius, 0, Math.PI * 2);
        ctx.fillStyle = ac.fill;
        ctx.fill();
        ctx.strokeStyle = ac.stroke;
        ctx.lineWidth   = 2;
        ctx.stroke();
        drawAsteroidText(ctx, a.answer, a.x, a.y, a.radius);
      }

      ctx.fillStyle = C.green;
      for (const b of bullets) ctx.fillRect(b.x, b.y, BUL_W, BUL_H);

      drawShip(gunX);
    }

    function renderWrongAnswer() {
      ctx.textAlign = 'center';

      ctx.fillStyle = C.red;
      ctx.font      = `bold 68px ${F.header}`;
      ctx.fillText('Wrong!', W / 2, 150);

      ctx.fillStyle = C.white;
      ctx.font      = `bold 22px ${F.mono}`;
      ctx.fillText(wrongQuestion.question, W / 2, 230);

      ctx.font      = `19px ${F.mono}`;
      ctx.fillStyle = C.grey;
      ctx.fillText('The correct answer was:', W / 2, 310);

      ctx.fillStyle = C.green;
      ctx.font      = `bold 32px ${F.mono}`;
      ctx.fillText(wrongQuestion.correct, W / 2, 370);
    }

    function renderEnd() {
      const secsLeft = Math.max(0, Math.ceil((END_MS - (performance.now() - endStartTs)) / 1000));
      ctx.textAlign  = 'center';

      ctx.fillStyle  = C.white;
      ctx.font       = `bold 56px ${F.header}`;
      ctx.fillText(endTitle, W / 2, 110);

      ctx.font       = `26px ${F.mono}`;
      ctx.fillText(`${score} / ${QUESTIONS.length}`, W / 2, 158);

      ctx.font       = `18px ${F.mono}`;
      ctx.fillStyle  = C.grey;
      ctx.fillText(`Returning to start in ${secsLeft} second${secsLeft === 1 ? '' : 's'}\u2026`, W / 2, 200);

      const recent = getRecentScores(playerInitials);
      if (recent.length > 0) {
        ctx.fillStyle = C.blue;
        ctx.font      = `17px ${F.mono}`;
        ctx.fillText(`\u2500\u2500 ${playerInitials} \u2014 recent scores \u2500\u2500`, W / 2, 248);

        const COL_SCORE = 180, COL_DATE = 620, ROW_START = 290, ROW_GAP = 34;

        recent.forEach((s, i) => {
          const y = ROW_START + i * ROW_GAP;
          const isCurrent = i === 0;

          ctx.font      = isCurrent ? `bold 18px ${F.mono}` : `17px ${F.mono}`;
          ctx.fillStyle = isCurrent ? C.green : C.grey;
          ctx.textAlign = 'left';
          ctx.fillText(`${s.score} / ${s.total}`, COL_SCORE, y);

          ctx.font      = isCurrent ? `bold 18px ${F.mono}` : `17px ${F.mono}`;
          ctx.fillStyle = isCurrent ? C.white : '#4a5a70';
          ctx.textAlign = 'right';
          ctx.fillText(fmtDate(s.ts), COL_DATE, y);
        });

        ctx.textAlign = 'center';
      }
    }

    // ── Game loop ──────────────────────────────────────────────────

    let devPaused    = false;
    let devAnalytics = false;

    function oLsSlope(values) {
      const n = values.length, xMean = (n - 1) / 2;
      const yMean = values.reduce((a, b) => a + b, 0) / n;
      let num = 0, den = 0;
      for (let i = 0; i < n; i++) { num += (i - xMean) * (values[i] - yMean); den += (i - xMean) ** 2; }
      return den === 0 ? 0 : num / den;
    }

    function trendLabel(slope, gameCount) {
      if (gameCount < 3) return { text: '— need 3+ games', color: '#3a4060' };
      if (slope >  5)   return { text: '\u2191 Improving',  color: C.green };
      if (slope < -5)   return { text: '\u2193 Declining',  color: C.red   };
      return               { text: '\u2192 Stable',         color: C.grey  };
    }

    function getAnalyticsData() {
      const all = JSON.parse(localStorage.getItem('sq_scores') || '[]');
      const players = {};
      for (const e of all) { if (!players[e.initials]) players[e.initials] = []; players[e.initials].push(e); }
      return Object.entries(players)
        .map(([initials, entries]) => {
          const pcts = entries.slice().reverse().map(e => e.score / e.total * 100);
          return { initials, entries, slope: oLsSlope(pcts) };
        })
        .sort((a, b) => new Date(b.entries[0].ts) - new Date(a.entries[0].ts));
    }

    function renderAnalytics() {
      ctx.fillStyle = C.navy;
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = 'left';
      ctx.fillStyle = C.white;
      ctx.font      = `bold 22px ${F.mono}`;
      ctx.fillText('DEV ANALYTICS', 24, 40);

      ctx.font      = `16px ${F.mono}`;
      ctx.fillStyle = C.grey;
      ctx.textAlign = 'right';
      ctx.fillText('A \u2192 close   \u00b7   P \u2192 pause/unpause', W - 24, 40);

      const ROW_H = 28, TABLE_TOP = 76;
      const COL = { player: 24, date: 120, score: 360, pct: 460, trend: 540 };

      ctx.textAlign = 'left';
      ctx.font      = `bold 16px ${F.mono}`;
      ctx.fillStyle = C.blue;
      for (const [label, x] of [['PLAYER', COL.player],['DATE', COL.date],['SCORE', COL.score],['%', COL.pct],['TREND', COL.trend]])
        ctx.fillText(label, x, TABLE_TOP);

      ctx.strokeStyle = C.panel; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(24, TABLE_TOP + 10); ctx.lineTo(W - 24, TABLE_TOP + 10); ctx.stroke();

      const data = getAnalyticsData();
      let rowY = TABLE_TOP + 10 + ROW_H, maxY = H - 24;

      for (const player of data) {
        const trend = trendLabel(player.slope, player.entries.length);
        for (let i = 0; i < player.entries.length; i++) {
          if (rowY > maxY) break;
          const e = player.entries[i], pct = Math.round(e.score / e.total * 100);
          const isFirst = i === 0;
          ctx.font      = isFirst ? `bold 17px ${F.mono}` : `17px ${F.mono}`;
          ctx.fillStyle = isFirst ? C.white : '#4a5070';
          ctx.textAlign = 'left';
          ctx.fillText(isFirst ? player.initials : '', COL.player, rowY);
          ctx.fillText(fmtDate(e.ts),                  COL.date,   rowY);
          ctx.fillText(`${e.score}/${e.total}`,         COL.score,  rowY);
          ctx.fillText(`${pct}%`,                       COL.pct,    rowY);
          if (isFirst) { ctx.fillStyle = trend.color; ctx.font = `bold 17px ${F.mono}`; ctx.fillText(trend.text, COL.trend, rowY); }
          rowY += ROW_H;
        }
        if (rowY <= maxY) {
          ctx.strokeStyle = C.navy;
          ctx.beginPath(); ctx.moveTo(24, rowY - ROW_H / 2); ctx.lineTo(W - 24, rowY - ROW_H / 2); ctx.stroke();
        }
      }

      if (data.length === 0) {
        ctx.textAlign = 'center'; ctx.fillStyle = '#3a4060'; ctx.font = `18px ${F.mono}`;
        ctx.fillText('No scores recorded yet. Play a game first.', W / 2, H / 2);
      }
    }

    function loop(ts) {
      if (!devPaused) {
        if (state === 'PLAYING') {
          if (!lastTs) lastTs = ts;
          const dt = Math.min((ts - lastTs) / 1000, 0.05);
          lastTs = ts;
          update(dt);
        }
        render();
      }
      rafId = requestAnimationFrame(loop);
    }

    // ── Input ──────────────────────────────────────────────────────

    document.addEventListener('keydown', e => {
      if (e.code === 'KeyP') { devPaused = !devPaused; lastTs = null; return; }
      if (e.code === 'KeyA' && document.activeElement !== document.getElementById('initials-input')) {
        devAnalytics = !devAnalytics; syncInputVisibility(); render(); return;
      }
      if (!['ArrowLeft','ArrowRight','Space'].includes(e.code)) return;
      e.preventDefault();
      if (state !== 'PLAYING') return;
      if (e.code === 'ArrowLeft')  keys.ArrowLeft  = true;
      if (e.code === 'ArrowRight') keys.ArrowRight = true;
      if (e.code === 'Space' && !keys._spaceHeld) { keys._spaceHeld = true; fireBullet(); }
    });

    document.addEventListener('keyup', e => {
      if (e.code === 'ArrowLeft')  keys.ArrowLeft  = false;
      if (e.code === 'ArrowRight') keys.ArrowRight = false;
      if (e.code === 'Space')      keys._spaceHeld = false;
    });

    canvas.addEventListener('click', e => {
      if (state !== 'START' || !startBtn || devAnalytics) return;
      const r  = canvas.getBoundingClientRect();
      const mx = (e.clientX - r.left) * (W / r.width);
      const my = (e.clientY - r.top)  * (H / r.height);
      if (mx >= startBtn.x && mx <= startBtn.x + startBtn.w && my >= startBtn.y && my <= startBtn.y + startBtn.h) startGame();
    });

    boot();
  </script>
</body>
</html>
